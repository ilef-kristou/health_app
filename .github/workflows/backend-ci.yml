name: Backend - Build, Nexus, Sonar, Docker Hub

on:
  push:
    branches:
      - main
      - develop
      - feature/*
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
  workflow_dispatch:   # Permet de lancer manuellement depuis l'interface

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ilefkristou/docker-spring-boot
      JAVA_HOME: ${{ github.workspace }}/.java   # Pas besoin du chemin fixe Linux, on utilise setup-java
      AWS_REGION: us-east-1                      # gardé mais non utilisé pour l'instant
      CLUSTER_NAME: mykubernetes                 # gardé mais non utilisé ici

    steps:
      # ────────────────────────────────────────────────
      # 1. Checkout (équivalent CHECKOUT GIT)
      # ────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # utile pour sonar + git describe si besoin

      # ────────────────────────────────────────────────
      # 2. Setup Java 17 (équivalent JAVA_HOME + PATH)
      # ────────────────────────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ────────────────────────────────────────────────
      # 3. MVN CLEAN
      # ────────────────────────────────────────────────
      - name: Maven Clean
        working-directory: ./backend
        run: mvn clean

      # ────────────────────────────────────────────────
      # 4. ARTIFACT CONSTRUCTION (package + skip tests + profile)
      # ────────────────────────────────────────────────
      - name: Maven Package (skip tests)
        working-directory: ./backend
        run: mvn package -Dmaven.test.skip=true -P test-coverage

      # ────────────────────────────────────────────────
      # 5. UNIT TESTS (séparé, comme dans Jenkins)
      # ────────────────────────────────────────────────
      - name: Maven Unit Tests
        working-directory: ./backend
        run: mvn test

      # ────────────────────────────────────────────────
      # 6. MVN SONARQUBE
      # ────────────────────────────────────────────────
      - name: SonarQube Scan
        working-directory: ./backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=docker-spring-boot \
            -Dsonar.host.url=http://sonarqube:9000 \
            -Dsonar.token=${SONAR_TOKEN}

      # ────────────────────────────────────────────────
      # 7. PUSH ARTIFACT TO NEXUS (équivalent exact de ton bloc)
      # ────────────────────────────────────────────────
      - name: Deploy JAR to Nexus
        working-directory: ./backend
        env:
          NEXUS_USER:     ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASS:     ${{ secrets.NEXUS_PASSWORD }}
          BUILD_NUMBER:   ${{ github.run_number }}
        run: |
          echo "Creating Maven settings.xml..."
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_PASS}</password>
              </server>
            </servers>
          </settings>
          EOF

          echo "Searching for JAR..."
          JAR_FILE=$(find target -name "*.jar" | head -n 1)
          echo "Found: $JAR_FILE"

          mvn deploy:deploy-file \
            -DgroupId=com.student \
            -DartifactId=student-management \
            -Dversion=1.0.${BUILD_NUMBER} \
            -Dpackaging=jar \
            -Dfile=${JAR_FILE} \
            -DrepositoryId=nexus \
            -Durl=http://nexus:8081/repository/maven-releases/ \
            -DgeneratePom=true \
            -s ~/.m2/settings.xml

      # ────────────────────────────────────────────────
      # 8. Setup Docker Buildx
      # ────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ────────────────────────────────────────────────
      # 9. Login Docker Hub
      # ────────────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ────────────────────────────────────────────────
      # 10. BUILD & PUSH DOCKER IMAGE (équivalent BUILD + PUSH)
      # ────────────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile               # ← assure-toi qu'il existe !
          push: true
          tags: |
            ${{ env.REGISTRY }}:${{ github.run_number }}
            ${{ env.REGISTRY }}:latest